# Draft. Mechanics follow SRD 5.2.1 (CC-BY-4.0, Wizards of the Coast LLC),
# adapted: the SRD's spells and magic are replaced by biology. Explanations
# are ours. Entries marked REVIEW are inventions that need a decision.
# cspell: disable
id: elf
name: Elf
srd_source: Elf
creature_type: Humanoid
size: Medium
speed: 30
explanation: >-
  A tall, slow-ageing line bred for stealth and endurance. Lean muscle,
  quick reflexes and sharp senses make them quiet and hard to surprise. They
  age so slowly that other peoples believe they never die.
traits:
  - id: darkvision-elf
    name: Darkvision
    channel: mutation
    srd_source: Darkvision
    explanation: Large light-gathering eyes.
    effects:
      - { kind: sense, target: darkvision, value: 60 }

  - id: fey-ancestry
    name: Fey Ancestry
    channel: mutation
    srd_source: Fey Ancestry
    explanation: >-
      Resistance to pheromones and chemicals that sway mood or will.
    effects:
      - { kind: advantage, target: "save:charmed" }

  - id: trance
    name: Trance
    channel: mutation
    srd_source: Trance
    explanation: >-
      Half the brain can rest while the other stays aware, so an elf needs
      far less sleep and cannot be sedated easily. The SRD adds that magic
      cannot put an elf to sleep; here that becomes resistance to sedatives
      (not yet modelled).
    activation:
      rest: long_rest_in_hours
      hours: 4

choices:
  - id: keen-senses
    name: Keen Senses
    pick: 1
    options:
      - id: keen-insight
        name: Insight
        channel: mutation
        srd_source: Keen Senses
        explanation: Reads small changes in posture, scent and voice.
        effects:
          - { kind: skill_proficiency, target: insight }
      - id: keen-perception
        name: Perception
        channel: mutation
        srd_source: Keen Senses
        explanation: Wide field of vision and acute hearing. Wider color spectrum for vision. Wider sound spectrum for hearing. 
        effects:
          - { kind: skill_proficiency, target: perception }
      - id: keen-survival
        name: Survival
        channel: mutation
        srd_source: Keen Senses
        explanation: Tracks by scent and notices small signs in the land.
        effects:
          - { kind: skill_proficiency, target: survival }

  # The SRD lineages grant spells. REVIEW: each is replaced by a biological
  # ability with the same role and the same uses.
  - id: elven-lineage
    name: Elven Lineage
    pick: 1
    options:
      - id: drow
        name: Drow
        channel: mutation
        srd_source: Drow
        explanation: |-
          A cave-adapted variant with larger eyes and light-producing skin.

          Each of these draws on an organ the line was engineered with, which makes the compound itself, so the drow carries no materials. The organs refill with rest, which is why the stronger uses recharge on a long rest.

          * Dancing Lights is a small phosphorus gland in each wrist. The compound is released as a fine aerosol that glows as it meets the air. A little goes a long way, so a small gland holds plenty and the ability is effectively at will.
          * Faerie Fire is a second gland that sprays a luminous marking compound from the wrist, so creatures or objects can be seen and followed.
          * Darkness is a sac of dark spores released in a cloud.
        effects:
          - { kind: sense, target: darkvision, value: 120 }
        activations:
          - { name: Dancing Lights, srd_replaces: Dancing Lights, uses: at_will }
          - { name: Faerie Fire, srd_replaces: Faerie Fire, uses: 1, recharge: long_rest, min_level: 3 }
          - { name: Darkness, srd_replaces: Darkness, uses: 1, recharge: long_rest, min_level: 5 }
      - id: high-elf
        name: High Elf
        channel: mutation
        srd_source: High Elf
        explanation: |-
          A variant with fine control and a sense tuned to engineered life
          and old technology. 

          * Prestidigitation is essentially slight of hand, a way of describing exceptionally high fine motor control, coordination, and a sense of timing.
          * Detect Magic is a sense of the engineered: an array of nanites attuned to detect the ultra low electronic emitions from other nanites that accompany nearly all bioengineered races.
          * Misty Step is a burst of speed: a nanite enhanced muscle activation allowing the user superhuman speed over short distances at the cost of higher lactose acid build up, thus requiring recovery between uses.
        activations:
          - { name: Prestidigitation, srd_replaces: Prestidigitation, uses: at_will }
          - { name: Detect Magic, srd_replaces: Detect Magic, uses: 1, recharge: long_rest, min_level: 3 }
          - { name: Misty Step, srd_replaces: Misty Step, uses: 1, recharge: long_rest, min_level: 5 }
      - id: wood-elf
        name: Wood Elf
        channel: mutation
        srd_source: Wood Elf
        explanation: |-
          A longer-legged variant adapted to forest travel.

          * Plant and Animal Speech applies to bioengineered plants and animals, which make up the bulk of what survive the post-apocolyptic landscape. These almost always have a nanite component enhancing their bioengineered behavior. The wood elf's nanite array is able to interface with these. 
          * Longstrider is endurance: unlike the High Elf's burst of speed, the Wood Elf's nanites are optimized to assist muscle endurance.
          * With sufficient training and concentration, the elf can use his/her enhanced senses to avoid disrupting nature in a way that allows for tracking providing the Pass without Trace capability. The rest requirement comes from the required concentration. Small glands in the soles and wrists also secrete a scent-masking compound that hides the odour dogs and trackers follow; they refill with rest too.
        effects:
          - { kind: speed, target: walk, value: 5 }
        activations:
          - { name: Plant and Animal Speech, srd_replaces: Druidcraft, uses: at_will }
          - { name: Longstrider, srd_replaces: Longstrider, uses: 1, recharge: long_rest, min_level: 3 }
          - { name: Pass without Trace, srd_replaces: Pass without Trace, uses: 1, recharge: long_rest, min_level: 5 }
